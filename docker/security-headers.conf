# Included into every location block. nginx does not inherit add_header into a
# block that declares its own, so a location setting Cache-Control would
# otherwise silently drop the whole security policy — which is exactly what
# happened to the app shell.
#
# The `wss://relay.dicebox.trollskull.cc` in connect-src is the relay origin and
# is the one thing here a self-hoster must change. Rooms do not work without it:
# `connect-src 'self'` blocks a WebSocket to a separate host outright. It is
# pinned to an exact origin on purpose — `wss:` or `*` would let a build that
# has been tampered with somewhere between the server and the browser post a
# derived key to any host it liked, and the pin is what stops that even if
# everything else has already gone wrong. Widening it is never the right fix.
#
# Running without rooms at all is fine: drop the origin back to `connect-src
# 'self'` and the app stays local-only, which is the default behaviour anyway.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' wss://relay.dicebox.trollskull.cc; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
